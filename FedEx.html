<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="StyleSheets/Base.CSS">
    <link rel="stylesheet" href="StyleSheets/FedEx.CSS">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FedEx</title>
</head>
<body>
  <h1>FedEx</h1>
  <div id="FedExDropdown">
    <button type="button" onclick="SelectInformationType()">None Selected</button>
    <ul id="FedExItemList" style="list-style-type: none;">
        <li value="0">Zip Code Data Information</li>
        <li value="1">Code Information</li>
    </ul>
  </div>
  <input type="text" placeholder="Enter Zip-Code">
  <button type="button" onclick="ValidateZipCode()">Search</button>
    <div id="FedExDeliveryRange">
        <div id="SingleDataList">
            <span id="FX_ZipCode">No Data</span>
            <span id="FX_Driver">No Data</span>
            <span id="FX_Region">No Data</span>
            <span id="FX_VanLine">No Data</span>
        </div>
        <div id="MultiDataList">
            <ul style="list-style: none;">
                
            </ul>
        </div>
    </div>
</body>
<script src="Scripts/index.js"></script>
<script>
    let inputTextVar = document.querySelector('input[type="text"]');
    let textAreaVar = document.getElementById('FedExDeliveryRange');
    let dropDownButton = document.querySelector('#FedExDropdown button');
    let dropDownList = document.getElementById('FedExItemList');


    function SelectInformationType()
    {
        if(dropDownList.style.display === "none" || dropDownList.style.display === "")
        {
            dropDownList.style.display = "block";
        }
        else
        {
            dropDownList.style.display = "none";
        }
        
        let listItems = dropDownList.getElementsByTagName('li');
        for (let i = 0; i < listItems.length; i++) {
            listItems[i].addEventListener('click', function() {
                dropDownButton.textContent = this.textContent;
                dropDownList.style.display = "none";
                let placeholderTextArray = this.textContent.split(' ');
                inputTextVar.value = "Enter " + placeholderTextArray[0] + " " + placeholderTextArray[1]; // Clear the input field when a new option is selected
            });
        }
    }

    let fedExDeliveryRangeText = []; 
    let fedExDriverColor = [];
    let fedExDeliveryZips = [];
    let fedExDeliveryDrivers = [];
    let fedExDeliveryLocations = [];
    let fedExDeliveryVanLines = [];

    //let rawData;
    let checkFetch = fetch('TextData/FedExDeliveryRange.txt')
        .then(response => response.text())
        .then(data => {
            let parsedArray = ParseStringData(data, ['-']);


            for(let index = 0; index < parsedArray.length; index++) {
                fedExDeliveryZips.push(parsedArray[index][0]);
                fedExDeliveryDrivers.push(parsedArray[index][1]);
                fedExDriverColor.push(parsedArray[index][2])
                fedExDeliveryLocations.push(parsedArray[index][3]);
                fedExDeliveryVanLines.push(parsedArray[index][4]);
            }

            fedExDeliveryZips.pop();
            fedExDeliveryDrivers.pop();
            fedExDriverColor.pop();
            fedExDeliveryLocations.pop();
            fedExDeliveryVanLines.pop();
        })
        .catch(error => {
            console.error('Error fetching FedExDeliveryRange.txt:', error);
            fedExDeliveryRangeText = "Error fetching FedExDeliveryRange.txt";
        });    

    function ValidateZipCode() {
        let enteredText = inputTextVar.value.trim();
        let validZip = fedExDeliveryZips.indexOf(enteredText);
        let validLocation = fedExDeliveryLocations.indexOf(enteredText);
        let validContractor = fedExDeliveryDrivers.indexOf(enteredText);
        let validVanLine = fedExDeliveryVanLines.indexOf(enteredText);

        let validSearch = validZip > validLocation ? validZip : validLocation > validContractor ? validLocation : validContractor > validVanLine ? validContractor : validVanLine;

        let fedexListLength = fedExDeliveryZips.length;

        if(validSearch != -1)
        {
            let textContent = "";
            
            if(validZip != -1)
            {
                
            }
            else
            {
                let localDataArray = [];

                if(validLocation != -1)
                {
                    
                    for(let index = 0; index < fedexListLength; index++)
                    {
                        if(fedExDeliveryLocations[index] == enteredText)
                        {
                            textContent += fedExDeliveryZips[index] + " / " + fedExDeliveryDrivers[index] + " / " + fedExDeliveryVanLines[index]; + "\n";
                        }
                    }
                    console.log(textContent);
                }
                else if(validContractor != -1)
                {
                    for(let index = 0; index < localDataArray.length; index++)
                    {
                        
                    }
                }
                else if(validVanLine != -1)
                {
                    for(let index = 0; index < localDataArray.length; index++)
                    {
                        
                    }
                }
                

            }

        }

        if(validSearch != -1) {
            document.getElementById('FX_ZipCode').textContent = fedExDeliveryZips[validSearch];
            document.getElementById('FX_ZipCode').style.color = "green";
            document.getElementById('FX_Driver').textContent = "Contractor: " + fedExDeliveryDrivers[validSearch];
            document.getElementById('FX_Driver').style.color = fedExDriverColor[validSearch];
            document.getElementById('FX_Region').textContent = "Area: " + fedExDeliveryLocations[validSearch];
            document.getElementById('FX_Region').style.color = "green";
            document.getElementById('FX_VanLine').textContent =fedExDeliveryVanLines[validSearch];
            document.getElementById('FX_VanLine').style.color = "green";
        } else {
            document.getElementById('FX_ZipCode').textContent = "NO DATA";
            document.getElementById('FX_ZipCode').style.color = "red";
            document.getElementById('FX_Driver').textContent = "NO DATA";
            document.getElementById('FX_Driver').style.color = "red";
            document.getElementById('FX_Region').textContent = "NO DATA";
            document.getElementById('FX_Region').style.color = "red";
            document.getElementById('FX_VanLine').textContent = "NO DATA";
            document.getElementById('FX_VanLine').style.color = "red";
        }
    }
</script>
</html>
