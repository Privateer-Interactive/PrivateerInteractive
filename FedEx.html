<body>

  <input type="text" placeholder="Enter Zip-Code">

   </div>>
</body>
<script>
    let inputTextVar = document.querySelector('input[type="text"]');
    let textAreaVar = document.getElementById('FedExDeliveryRange');

    function TextFitting(textContainer)
    {
        // let currentSize = parseFloat(textContainer.style.fontSize) || 16; // Default font size if not set
        // if(currentSize > textContainer.scrollHeight)
        // {
        //     while (textContainer.scrollHeight > textContainer.clientHeight && currentSize > 0) {
        //         currentSize -= 1; // Decrease font size
        //         textContainer.style.fontSize = currentSize + 'px';
        //     }
        // }
        // else
        // {
        //     while (textContainer.scrollHeight <= textContainer.clientHeight && currentSize < 1000) {
        //         currentSize += 1; // Increase font size
        //         textContainer.style.fontSize = currentSize + 'px';
        //     }
        //     // Decrease by one to ensure it fits
        //     currentSize -= 1;
        //     textContainer.style.fontSize = currentSize + 'px';
        // }
    }


    let fedExDeliveryRangeText = []; 
    let fedExDeliveryZips = [];
    let fedExDeliveryDrivers = [];
    let fedExDeliveryLocations = [];
    let fedExDeliveryVanLines = [];

    fetch('TextData/FedExDeliveryRange.txt')
        .then(response => response.text())
        .then(data => {
            let localSplit = data.split('\n').map(range => range.trim());
            for(let i = 0; i < localSplit.length; i++) {
                let lineSplit = localSplit[i].split('-').map(range => range.trim());
                fedExDeliveryRangeText.push(lineSplit);
                fedExDeliveryZips.push(fedExDeliveryRangeText[i][0]);
                fedExDeliveryDrivers.push(fedExDeliveryRangeText[i][1]);
                // color code for contractor status identification
                fedExDeliveryLocations.push(fedExDeliveryRangeText[i][3]);
                fedExDeliveryVanLines.push(fedExDeliveryRangeText[i][4]);
            }

            fedExDeliveryZips.pop();
        })
        .catch(error => {
            console.error('Error fetching FedExDeliveryRange.txt:', error);
            fedExDeliveryRangeText = "Error fetching FedExDeliveryRange.txt";
        });    
        
    window.onload = function() { console.log(fedExDeliveryRangeText.length) };

    function ValidateZipCode() {
        let zipCode = document.querySelector('input[type="text"]').value.trim();
        zipCode = inputTextVar.value.trim();
        if(fedExDeliveryZips.includes(zipCode)) {
            let indexValue = fedExDeliveryZips.indexOf(zipCode);
            document.getElementById('FedExDeliveryRange').value = zipCode + " - Valid zip code.\n" + "Contractor: " + fedExDeliveryDrivers[indexValue] + "\nArea: " + fedExDeliveryLocations[indexValue] + "\nVan Line: " + fedExDeliveryVanLines[indexValue];
            document.getElementById('FedExDeliveryRange').style.color = "green";
        } else {
            document.getElementById('FedExDeliveryRange').value = zipCode + " - Invalid zip code. Delivery is not available.";
            document.getElementById('FedExDeliveryRange').style.color = "red";
        }

        TextFitting(textAreaVar);
    }
</script>
</html>
