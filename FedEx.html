<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="StyleSheets/index.CSS">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FedEx</title>
</head>
<body>
  <h1>FedEx</h1>
  <input type="text" placeholder="Enter Zip-Code">
  <button type="button" onclick="ValidateZipCode()">Search</button>
    <textarea id="FedExDeliveryRange">
    
  </textarea>
</body>
<script>
    let fedExDeliveryRangeText = []; 
    let fedExDeliveryZips = [];
    fetch('TextData/FedExDeliveryRange.txt')
        .then(response => response.text())
        .then(data => {
            //document.getElementById('FedExDeliveryRange').value = data;
            let localSplit = data.split('\n').map(range => range.trim());
            
            for(let i = 0; i < localSplit.length; i++) {
                //console.log(fedExDeliveryRangeText[i]);
                //fedExDeliveryRangeText = fedExDeliveryRangeText.concat(fedExDeliveryRangeText, localSplit[i].split('-').map(range => range.trim()));
                fedExDeliveryRangeText.push(localSplit[i].split('-').map(range => range.trim()));
                fedExDeliveryZips.push(fedExDeliveryRangeText[i][0]);
            }
        })
        .catch(error => {
            console.error('Error fetching FedExDeliveryRange.txt:', error);
            fedExDeliveryRangeText = "Error fetching FedExDeliveryRange.txt";
        });    
        
    window.onload = function() { console.log(fedExDeliveryRangeText.length) };
    //let fedExDeliveryRange = fedExDeliveryRangeText?.split('-').map(range => range.trim());
    

    // let textAreaText = document.getElementById('FedExDeliveryRange')?.value;
    // let validZipCodePatterns;


    // for (let i = 0; i < (fedExDeliveryRange?.length ?? 0); i+=3) {
    //     validZipCodePatterns = fedExDeliveryRange[i];
        
    // }
    
    // for(let i = 0; i < (validZipCodePatterns?.length ?? 0); i++) {
    //     console.log(validZipCodePatterns[i]);
    // }

    function ValidateZipCode() {
        //const zipCodePattern = /^\d{5}$/; // Regular expression for 5-digit zip code
        let zipCode = document.querySelector('input[type="text"]').value.trim();
        if(fedExDeliveryZips.includes(zipCode)) {
            document.getElementById('FedExDeliveryRange').value = "Valid zip code. Delivery is available.";
            document.getElementById('FedExDeliveryRange').style.color = "green";
            //return true; // Valid zip code
        } else {
            document.getElementById('FedExDeliveryRange').value = "Invalid zip code. Delivery is not available.";
            document.getElementById('FedExDeliveryRange').style.color = "red";
            //return false; // Invalid zip code
        }
        //return zipCodePattern.test(zipCode);
    }
</script>
</html>
